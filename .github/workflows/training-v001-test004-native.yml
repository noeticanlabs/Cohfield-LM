name: training-v001-test004-native

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cf-lm-training-v001
    paths:
      - 'src/bin/training_v001_test003.rs'
      - '.github/workflows/training-v001-test004-native.yml'
      - 'docs/COHFIELD_LM_TRAINING_V001_TEST004.md'

jobs:
  native-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust format check
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --all-targets
      - name: Reconstruct frozen Test 004 datasets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          payload = {
            'train.tsv': os.environ['TRAIN_B64'],
            'validation.tsv': os.environ['VAL_B64'],
            'test.tsv': os.environ['TEST_B64'],
          }
          expected = {
            'train.tsv':'2a556797023f7d0b3181aa761127d6510a1801416bc51808faeea0e63c9f9cbe',
            'validation.tsv':'042f2623260d87092bb24eace3bdee8ff59e2dac6484fa65c77e1204448590ac',
            'test.tsv':'23fb3bb4c023ab9d68939b56cd824ef1684b928014d740afd8fea86fff98bc07',
          }
          out=Path('target/test004-data'); out.mkdir(parents=True, exist_ok=True)
          for name,b64 in payload.items():
              data=base64.b64decode(b64)
              sha=hashlib.sha256(data).hexdigest()
              assert sha==expected[name], (name,sha,expected[name])
              (out/name).write_bytes(data)
          PY
        env:
          TRAIN_B64: ${{ secrets.CFLM_T004_TRAIN_B64 }}
          VAL_B64: ${{ secrets.CFLM_T004_VALIDATION_B64 }}
          TEST_B64: ${{ secrets.CFLM_T004_TEST_B64 }}
      - name: Native replay run 1
        run: cargo run --release --bin training_v001_test003 -- target/test004-data/train.tsv target/test004-data/validation.tsv target/test004-data/test.tsv > target/test004-run1.json
      - name: Native replay run 2
        run: cargo run --release --bin training_v001_test003 -- target/test004-data/train.tsv target/test004-data/validation.tsv target/test004-data/test.tsv > target/test004-run2.json
      - name: Determinism and reference parity
        run: |
          cmp target/test004-run1.json target/test004-run2.json
          python - <<'PY'
          import json, math
          r=json.load(open('target/test004-run1.json'))
          exp={
            'train_examples':4540,
            'learned_features':20287,
            'target_vocabulary':530,
            'validation':{
              'true':(534,0.5149812734082397,6.700374531835206),
              'context_ablation':(534,0.2247191011235955,18.49250936329588),
              'wrong_context':(534,0.0,56.91760299625468),
              'shuffled_context':(534,0.04119850187265917,66.77902621722846),
              'paired_supported_sources':255,'paired_both_correct':78,'paired_accuracy':0.3058823529411765,
              'baseline_context_majority':0.39325842696629215,
              'baseline_source_type_majority':0.2247191011235955,
              'baseline_source_type_context_majority':0.3951310861423221,
            },
            'test':{
              'true':(545,0.5486238532110091,5.027522935779817),
              'context_ablation':(545,0.20550458715596331,18.332110091743118),
              'wrong_context':(545,0.0,55.862385321100916),
              'shuffled_context':(545,0.029357798165137616,66.84036697247707),
              'paired_supported_sources':258,'paired_both_correct':87,'paired_accuracy':0.3372093023255814,
              'baseline_context_majority':0.3853211009174312,
              'baseline_source_type_majority':0.20550458715596331,
              'baseline_source_type_context_majority':0.3871559633027523,
            }
          }
          assert r['train_examples']==exp['train_examples']
          assert r['learned_features']==exp['learned_features']
          assert r['target_vocabulary']==exp['target_vocabulary']
          tol=5e-12
          for split in ('validation','test'):
              for v in ('true','context_ablation','wrong_context','shuffled_context'):
                  n,a,m=exp[split][v]
                  got=r[split][v]
                  assert got['n']==n
                  assert abs(got['accuracy']-a)<=tol,(split,v,'acc',got['accuracy'],a)
                  assert abs(got['mean_rank']-m)<=tol,(split,v,'rank',got['mean_rank'],m)
              for k in ('paired_supported_sources','paired_both_correct'):
                  assert r[split][k]==exp[split][k]
              for k in ('paired_accuracy','baseline_context_majority','baseline_source_type_majority','baseline_source_type_context_majority'):
                  assert abs(r[split][k]-exp[split][k])<=tol,(split,k,r[split][k],exp[split][k])
          print('TEST004_NATIVE_PARITY_PASS')
          PY
      - name: Seal hashes
        run: |
          sha256sum src/bin/training_v001_test003.rs target/test004-data/*.tsv target/test004-run1.json target/test004-run2.json | tee target/test004-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: training-v001-test004-native-receipt
          path: |
            target/test004-run1.json
            target/test004-run2.json
            target/test004-sha256.txt
