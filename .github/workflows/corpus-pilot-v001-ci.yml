name: CF-LM Corpus Pilot v0.01 CI

on:
  push:
    branches:
      - agent/cf-lm-corpus-pilot-v001
  workflow_dispatch:

jobs:
  corpus-pilot-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check new pilot surface
        run: rustfmt --edition 2021 --check src/corpus_pilot_v001.rs tests/corpus_pilot_v001.rs src/bin/corpus_pilot_v001.rs
      - name: Run corpus pilot tests
        run: cargo test --test corpus_pilot_v001
      - name: Compile pilot CLI
        run: cargo build --bin corpus_pilot_v001

  inherited-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full inherited regression suite
        run: cargo test --all-targets
