name: CF-LM Navier-Stokes Native v0.01

on:
  push:
    branches:
      - agent/cf-lm-navier-stokes-native-v001
  workflow_dispatch:

jobs:
  native-training-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconstruct frozen Navier-Stokes CFLM packs
        shell: bash
        run: |
          mkdir -p /tmp/cflm-ns
          cat > /tmp/cflm-ns/packs.tar.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/cflm-ns/packs.tar.gz.b64 > /tmp/cflm-ns/packs.tar.gz
          echo 'c36e212e6a4240b797c0c6c9f1ebfa38017b0c91ebc703f3e591267616625546  /tmp/cflm-ns/packs.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cflm-ns/packs.tar.gz -C /tmp/cflm-ns
          echo '4d0ec2bea1b856fe513f1af5469f0757d12245a1e5fb163693d275420e872fe5  /tmp/cflm-ns/train.cflm' | sha256sum -c -
          echo 'e97b96d4bb26044266759f9797eac0facfe033f976fd095e06600b295a81568b  /tmp/cflm-ns/validation.cflm' | sha256sum -c -
          echo '8324b3f9aa978f7959f4363ece7378480d2ba9c87e53382c236e649b78d06b64  /tmp/cflm-ns/test.cflm' | sha256sum -c -
      - name: Run exact repository corpus pilot binary
        shell: bash
        run: |
          mkdir -p training-results
          for e in 1 4 16; do
            cargo run --quiet --bin corpus_pilot_v001 -- /tmp/cflm-ns/train.cflm /tmp/cflm-ns/validation.cflm "$e" | tee "training-results/validation_e${e}.json"
            cargo run --quiet --bin corpus_pilot_v001 -- /tmp/cflm-ns/train.cflm /tmp/cflm-ns/test.cflm "$e" | tee "training-results/test_e${e}.json"
          done
      - name: Run inherited regression suite
        run: cargo test --all-targets
      - name: Upload training receipts
        uses: actions/upload-artifact@v4
        with:
          name: cflm-navier-stokes-native-v001-results
          path: training-results/*.json
