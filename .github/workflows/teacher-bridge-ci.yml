name: CF-LM Teacher Bridge CI

on:
  push:
    branches:
      - agent/cf-lm-teacher-bridge-v001
      - agent/cf-lm-teacher-bridge-v002
  workflow_dispatch:

jobs:
  new-experiment-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check new surface
        run: rustfmt --edition 2021 --check src/teacher_bridge.rs src/teacher_bridge_v002.rs tests/teacher_bridge_v001.rs tests/teacher_bridge_v002.rs
      - name: Compile and run teacher bridge tests
        run: |
          cargo test --test teacher_bridge_v001
          cargo test --test teacher_bridge_v002

  inherited-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full inherited regression suite
        run: cargo test --all-targets
